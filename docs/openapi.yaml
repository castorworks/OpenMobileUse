openapi: 3.1.2
info: {title: Open Mobile Use HTTP API, version: development, description: 独立设备服务的目标契约。脚本正文采用项目统一 JSON 格式，业务语义沿用核心校验。}
servers:
- {url: 'http://127.0.0.1:18765', description: 默认本机地址。远程访问通过配置的 HTTPS 入口。}
security:
- BearerToken: []
tags:
- {name: Service}
- {name: Devices}
- {name: Tasks}
- {name: Runs}
- {name: Scripts}
- {name: Conversations}
paths:
  /healthz:
    get:
      operationId: health
      tags: [Service]
      summary: 进程健康状态
      security: []
      responses:
        '200':
          description: 查询成功。
          headers:
            X-OMU-Instance:
              description: 服务进程本次启动的标识。
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '500': {$ref: '#/components/responses/Error500'}
  /readyz:
    get:
      operationId: readiness
      tags: [Service]
      summary: 服务接单状态
      security: []
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
  /openapi.json:
    get:
      operationId: openApiDocument
      tags: [Service]
      summary: 读取 OpenAPI 契约
      security: []
      responses:
        '200':
          description: 契约文档。
          content:
            application/json:
              schema: {type: object}
        '500': {$ref: '#/components/responses/Error500'}
  /api/capabilities:
    get:
      operationId: getCapabilities
      tags: [Service]
      summary: 读取服务能力和运行限制
      x-omu-permission: devices:read
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capabilities'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/devices:
    get:
      operationId: listDevices
      tags: [Devices]
      summary: 列出授权设备
      x-omu-permission: devices:read
      parameters:
      - name: cursor
        in: query
        description: 上一次查询返回的不透明分页游标。
        schema: {type: string}
      - name: limit
        in: query
        description: 单页结果数。
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      - name: refresh
        in: query
        description: 等待一次有界的设备发现刷新。
        schema: {type: boolean}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevicePage'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/devices/{deviceId}:
    get:
      operationId: getDevice
      tags: [Devices]
      summary: 读取设备信息
      x-omu-permission: devices:read
      parameters:
      - name: deviceId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/devices/{deviceId}/pending-actions:
    get:
      operationId: listPendingActions
      tags: [Devices]
      summary: 列出待核对的动作
      x-omu-permission: devices:reconcile
      parameters:
      - name: deviceId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      - name: cursor
        in: query
        description: 上一次查询返回的不透明分页游标。
        schema: {type: string}
      - name: limit
        in: query
        description: 单页结果数。
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PendingActionPage'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/devices/{deviceId}/pending-actions/{actionId}/ack:
    post:
      operationId: acknowledgeAction
      tags: [Devices]
      summary: 核对待确认的已派发动作
      x-omu-permission: devices:reconcile
      parameters:
      - name: deviceId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      - name: actionId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcknowledgeAction'}
      responses:
        '200':
          description: 核对结果已登记。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionAcknowledgement'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '415': {$ref: '#/components/responses/Error415'}
        '422': {$ref: '#/components/responses/Error422'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
  /api/tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: 列出注册 Agent 任务
      x-omu-permission: runs:read
      parameters:
      - name: cursor
        in: query
        description: 上一次查询返回的不透明分页游标。
        schema: {type: string}
      - name: limit
        in: query
        description: 单页结果数。
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPage'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/tasks/{taskId}:
    get:
      operationId: getTask
      tags: [Tasks]
      summary: 读取注册任务描述
      x-omu-permission: runs:read
      parameters:
      - name: taskId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,80}$'}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/runs:
    post:
      operationId: createRun
      tags: [Runs]
      summary: 提交异步设备运行
      x-omu-permission: runs:submit
      parameters:
      - name: Idempotency-Key
        in: header
        description: 每次预期执行使用新的键。相同主体、同键和相同请求复用原运行。
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunRequest'}
      responses:
        '202':
          description: 运行已持久化受理。
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSummary'}
        '200':
          description: 相同幂等键的终态运行。
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSummary'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '412': {$ref: '#/components/responses/Error412'}
        '413': {$ref: '#/components/responses/Error413'}
        '415': {$ref: '#/components/responses/Error415'}
        '422': {$ref: '#/components/responses/Error422'}
        '428': {$ref: '#/components/responses/Error428'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
    get:
      operationId: listRuns
      tags: [Runs]
      summary: 列出运行历史
      x-omu-permission: runs:read
      parameters:
      - name: cursor
        in: query
        description: 上一次查询返回的不透明分页游标。
        schema: {type: string}
      - name: limit
        in: query
        description: 单页结果数。
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      - name: deviceId
        in: query
        description: 按设备筛选。
        schema: {type: string, format: uuid}
      - name: status
        in: query
        description: 按当前状态筛选。
        schema: {$ref: '#/components/schemas/RunStatus'}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/runs/{runId}:
    get:
      operationId: getRun
      tags: [Runs]
      summary: 读取运行结果和事件位置
      x-omu-permission: runs:read
      parameters:
      - name: runId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/runs/{runId}/cancel:
    post:
      operationId: cancelRun
      tags: [Runs]
      summary: 请求停止运行
      x-omu-permission: runs:cancel
      parameters:
      - name: runId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      responses:
        '202':
          description: 正在取消，仍可能等待设备会话关闭。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '200':
          description: 运行已进入终态。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/runs/{runId}/events:
    get:
      operationId: getRunEvents
      tags: [Runs]
      summary: 分页读取或订阅运行事件
      x-omu-permission: runs:read
      parameters:
      - name: runId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      - name: Last-Event-ID
        in: header
        description: SSE 断线重连时最后收到的事件序号。
        schema: {type: string, pattern: ^\d+$}
      - name: after
        in: query
        description: JSON 分页从此序号之后读取。
        schema: {type: integer, minimum: 0}
      - name: limit
        in: query
        description: JSON 单页结果数。
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: 事件分页或可重连的 SSE 事件流。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventPage'}
            text/event-stream:
              schema: {type: string, description: UTF-8 SSE。id 为 sequence，event 为 type，data 为 Event JSON。心跳为 SSE
                  注释。}
              example: 'id: 4

                event: run.status

                data: {"sequence":4,"type":"run.status","at":"2026-11-25T08:00:00Z","data":{"status":"succeeded"}}


                '
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '410': {$ref: '#/components/responses/Error410'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/runs/{runId}/artifacts/{artifactId}:
    get:
      operationId: downloadArtifact
      tags: [Runs]
      summary: 下载已授权的运行产物
      x-omu-permission: artifacts:read
      parameters:
      - name: runId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      - name: artifactId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 返回原始内容。录制为可直接重放的 Script JSON。
          content:
            application/json:
              schema:
                anyOf:
                - {$ref: '#/components/schemas/Script'}
                - {type: object}
            application/xml:
              schema: {type: string}
            image/png:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '410': {$ref: '#/components/responses/Error410'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/scripts:
    get:
      operationId: listScripts
      tags: [Scripts]
      summary: 列出脚本
      x-omu-permission: scripts:read
      parameters:
      - name: cursor
        in: query
        description: 上一次查询返回的不透明分页游标。
        schema: {type: string}
      - name: limit
        in: query
        description: 单页结果数。
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      - name: includeArchived
        in: query
        description: 包含已归档用户脚本。
        schema: {type: boolean}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScriptPage'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '500': {$ref: '#/components/responses/Error500'}
    post:
      operationId: createScript
      tags: [Scripts]
      summary: 导入脚本或保存录制副本
      x-omu-permission: scripts:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateScript'}
      responses:
        '201':
          description: 脚本已创建。
          headers:
            Location: {$ref: '#/components/headers/Location'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScriptResource'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '410': {$ref: '#/components/responses/Error410'}
        '413': {$ref: '#/components/responses/Error413'}
        '415': {$ref: '#/components/responses/Error415'}
        '422': {$ref: '#/components/responses/Error422'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/scripts/{scriptId}:
    get:
      operationId: getScript
      tags: [Scripts]
      summary: 读取脚本元数据
      x-omu-permission: scripts:read
      parameters:
      - name: scriptId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 查询成功。
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScriptResource'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
    patch:
      operationId: updateScript
      tags: [Scripts]
      summary: 更新标题、正文或归档状态
      x-omu-permission: scripts:write
      parameters:
      - name: scriptId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      - name: If-Match
        in: header
        description: 提交此前读取的强 ETag。
        required: true
        schema: {type: string, description: 从资源响应 ETag 头读取的强实体标签，包含双引号。}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatchScript'}
      responses:
        '200':
          description: 脚本已更新。
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScriptResource'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '412': {$ref: '#/components/responses/Error412'}
        '413': {$ref: '#/components/responses/Error413'}
        '415': {$ref: '#/components/responses/Error415'}
        '422': {$ref: '#/components/responses/Error422'}
        '428': {$ref: '#/components/responses/Error428'}
        '500': {$ref: '#/components/responses/Error500'}
    delete:
      operationId: deleteScript
      tags: [Scripts]
      summary: 删除用户脚本
      x-omu-permission: scripts:write
      parameters:
      - name: scriptId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      - name: If-Match
        in: header
        description: 提交此前读取的强 ETag。
        required: true
        schema: {type: string, description: 从资源响应 ETag 头读取的强实体标签，包含双引号。}
      responses:
        '204': {description: 脚本已删除。}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '412': {$ref: '#/components/responses/Error412'}
        '428': {$ref: '#/components/responses/Error428'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/scripts/{scriptId}/content:
    get:
      operationId: downloadScript
      tags: [Scripts]
      summary: 下载脚本正文
      x-omu-permission: scripts:read
      parameters:
      - name: scriptId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 查询成功。
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Script'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/conversations:
    get:
      operationId: listConversations
      tags: [Conversations]
      summary: 列出对话
      x-omu-permission: conversations:read
      parameters:
      - name: cursor
        in: query
        description: 上一次查询返回的不透明分页游标。
        schema: {type: string}
      - name: limit
        in: query
        description: 单页结果数。
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      - name: deviceId
        in: query
        description: 按绑定设备筛选。
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationPage'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '500': {$ref: '#/components/responses/Error500'}
    post:
      operationId: createConversation
      tags: [Conversations]
      summary: 创建对话，可从已有录制的独立副本继续
      x-omu-permission: conversations:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateConversation'}
      responses:
        '201':
          description: 对话已创建。
          headers:
            Location: {$ref: '#/components/headers/Location'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '412': {$ref: '#/components/responses/Error412'}
        '413': {$ref: '#/components/responses/Error413'}
        '415': {$ref: '#/components/responses/Error415'}
        '422': {$ref: '#/components/responses/Error422'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [Conversations]
      summary: 读取对话状态
      x-omu-permission: conversations:read
      parameters:
      - name: conversationId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 查询成功。
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
    patch:
      operationId: renameConversation
      tags: [Conversations]
      summary: 修改对话标题
      x-omu-permission: conversations:write
      parameters:
      - name: conversationId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      - name: If-Match
        in: header
        description: 提交此前读取的强 ETag。
        required: true
        schema: {type: string, description: 从资源响应 ETag 头读取的强实体标签，包含双引号。}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatchConversation'}
      responses:
        '200':
          description: 标题已更新。
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '412': {$ref: '#/components/responses/Error412'}
        '413': {$ref: '#/components/responses/Error413'}
        '415': {$ref: '#/components/responses/Error415'}
        '428': {$ref: '#/components/responses/Error428'}
        '500': {$ref: '#/components/responses/Error500'}
    delete:
      operationId: deleteConversation
      tags: [Conversations]
      summary: 删除对话
      x-omu-permission: conversations:write
      parameters:
      - name: conversationId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      - name: If-Match
        in: header
        description: 提交此前读取的强 ETag。
        required: true
        schema: {type: string, description: 从资源响应 ETag 头读取的强实体标签，包含双引号。}
      responses:
        '204': {description: 对话已删除。}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '412': {$ref: '#/components/responses/Error412'}
        '428': {$ref: '#/components/responses/Error428'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      tags: [Conversations]
      summary: 按顺序读取对话消息
      x-omu-permission: conversations:read
      parameters:
      - name: conversationId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      - name: cursor
        in: query
        description: 上一次查询返回的不透明分页游标。
        schema: {type: string}
      - name: limit
        in: query
        description: 单页结果数。
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
  /api/conversations/{conversationId}/recording:
    get:
      operationId: downloadConversationRecording
      tags: [Conversations]
      summary: 下载截至指定轮次的已确认脚本
      x-omu-permission: artifacts:read
      parameters:
      - name: conversationId
        in: path
        description: 目标资源标识。
        required: true
        schema: {type: string, format: uuid}
      - name: throughTurn
        in: query
        description: 包含的最后一个已完成轮次。
        schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Script'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '422': {$ref: '#/components/responses/Error422'}
        '500': {$ref: '#/components/responses/Error500'}
components:
  securitySchemes:
    BearerToken: {type: http, scheme: bearer, description: 由宿主管理员授权的令牌。具体权限由各请求的 x-omu-permission 描述。}
  headers:
    ETag:
      description: 当前资源的强实体标签。
      schema: {type: string, description: 从资源响应 ETag 头读取的强实体标签，包含双引号。}
    Location:
      description: 所创建资源的访问路径。
      schema: {type: string, format: uri-reference}
  responses:
    Error400:
      description: 请求格式无效
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Error401:
      description: 缺少凭据或凭据无效
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Error403:
      description: 权限不足
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Error404:
      description: 资源不可访问或不存在
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Error409:
      description: 资源冲突或设备忙
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Error410:
      description: 产物或事件游标已过期
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Error412:
      description: 条件请求失败
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Error413:
      description: 请求正文过大
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Error415:
      description: 不支持请求媒体类型
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Error422:
      description: 业务输入无效
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Error428:
      description: 缺少前置条件
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Error429:
      description: 请求或队列超出配额
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Error500:
      description: 服务内部错误
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Error503:
      description: 当前无法受理请求
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Platform:
      type: string
      enum: [android, harmony, ios]
    Kind:
      type: string
      enum: [capture, diagnose, step, script, chat, agent]
    RunStatus:
      type: string
      enum: [queued, starting, running, cancelling, succeeded, needs_review, failed, cancelled]
    TerminalStatus:
      type: string
      enum: [succeeded, needs_review, failed, cancelled]
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string, minLength: 1}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string, pattern: '^[A-Z][A-Z0-9_]+$'}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        runUrl: {type: string, format: uri-reference}
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, starting, draining]
      additionalProperties: false
    DriverStatus:
      type: object
      required: [platform, available]
      properties:
        platform: {$ref: '#/components/schemas/Platform'}
        available: {type: boolean}
        code: {type: string, pattern: '^[A-Z][A-Z0-9_]+$'}
      additionalProperties: false
    Capabilities:
      type: object
      required: [kinds, drivers, modelProfiles, limits]
      properties:
        kinds:
          type: array
          items: {$ref: '#/components/schemas/Kind'}
        drivers:
          type: array
          items: {$ref: '#/components/schemas/DriverStatus'}
        modelProfiles:
          type: array
          items:
            type: object
            required: [id, allowsImages]
            properties:
              id: {type: string, minLength: 1}
              allowsImages: {type: boolean}
            additionalProperties: false
        limits:
          type: object
          required: [requestBytes, queuePerDevice, observationTtlMs, maximumTimeoutMs, defaultTimeoutMs]
          properties:
            requestBytes: {type: integer, minimum: 1}
            queuePerDevice: {type: integer, minimum: 0}
            observationTtlMs: {type: integer, minimum: 1}
            maximumTimeoutMs: {type: integer, minimum: 1}
            defaultTimeoutMs: {type: integer, minimum: 1}
          additionalProperties: false
      additionalProperties: false
    Device:
      type: object
      required: [id, platform, name, state, connection, busy, needsReview]
      properties:
        id: {type: string, format: uuid}
        platform: {$ref: '#/components/schemas/Platform'}
        name: {type: string, minLength: 1}
        state:
          type: string
          enum: [available, offline, unauthorized, driver_unavailable, conflict]
        connection:
          type: string
          enum: [usb, network, emulator, unknown]
        busy: {type: boolean}
        needsReview: {type: boolean}
        lastSeenAt: {type: string, format: date-time}
        errorCode: {type: string, pattern: '^[A-Z][A-Z0-9_]+$'}
      additionalProperties: false
    PendingAction:
      type: object
      required: [id, deviceId, runId, sequence, action, dispatchedAt]
      properties:
        id: {type: string, format: uuid}
        deviceId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1}
        action: {type: string, minLength: 1}
        dispatchedAt: {type: string, format: date-time}
      additionalProperties: false
    AcknowledgeAction:
      type: object
      required: [observationId, outcome]
      properties:
        observationId: {type: string, minLength: 1, maxLength: 200}
        outcome:
          type: string
          enum: [applied, not_applied, accepted_current_state]
      additionalProperties: false
    ActionAcknowledgement:
      type: object
      required: [id, acknowledgedAt, outcome]
      properties:
        id: {type: string, format: uuid}
        acknowledgedAt: {type: string, format: date-time}
        outcome:
          type: string
          enum: [applied, not_applied, accepted_current_state]
      additionalProperties: false
    Selector:
      type: object
      properties:
        id: {type: string, minLength: 1}
        label: {type: string, minLength: 1}
        role: {type: string, minLength: 1}
        within: {type: string, minLength: 1}
        cardX: {type: number, minimum: 0, maximum: 1}
        cardY: {type: number, minimum: 0, maximum: 1}
      dependentRequired:
        within: [id, role]
        cardX: [within, cardY]
        cardY: [within, cardX]
      additionalProperties: false
      oneOf:
      - required: [id]
      - required: [label]
    Reading:
      type: object
      properties:
        checked: {type: boolean}
        value: {type: string}
        label: {type: string}
      additionalProperties: false
    ScreenGuard:
      type: object
      required: [width, height, rotation, anchors]
      properties:
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        rotation: {type: number}
        anchors:
          type: array
          items: {$ref: '#/components/schemas/Selector'}
          maxItems: 3
      additionalProperties: false
    ImageAnchor:
      type: object
      required: [rgb, dx, dy]
      properties:
        rgb: {type: string, minLength: 1700, maxLength: 1700, pattern: '^[A-Za-z0-9+/]+$'}
        dx: {type: integer, minimum: 0, maximum: 24}
        dy: {type: integer, minimum: 0, maximum: 16}
        match: {type: string, const: contour}
        row:
          type: object
          required: [rgb, offsetX]
          properties:
            rgb: {type: string, minLength: 1700, maxLength: 1700, pattern: '^[A-Za-z0-9+/]+$'}
            offsetX:
              oneOf:
              - {type: integer, minimum: -455, maximum: -25}
              - {type: integer, minimum: 25, maximum: 455}
          additionalProperties: false
      additionalProperties: false
      not:
        required: [match, row]
    NativeStep:
      oneOf:
      - type: object
        required: [action]
        properties:
          action: {type: string, const: tap}
          observation: {type: string, pattern: '^[a-f0-9]{64}$'}
          id: {type: string, minLength: 1}
          label: {type: string, minLength: 1}
          role: {type: string, minLength: 1}
          within: {type: string, minLength: 1}
          cardX: {type: number, minimum: 0, maximum: 1}
          cardY: {type: number, minimum: 0, maximum: 1}
        dependentRequired:
          within: [id, role]
          cardX: [within, cardY]
          cardY: [within, cardX]
        additionalProperties: false
        oneOf:
        - required: [id]
        - required: [label]
      - type: object
        required: [action, x, y]
        properties:
          action: {type: string, const: tap}
          x: {type: number, minimum: 0, maximum: 1}
          y: {type: number, minimum: 0, maximum: 1}
          observation: {type: string, pattern: '^[a-f0-9]{64}$'}
        additionalProperties: false
      - type: object
        required: [action, fromX, fromY, toX, toY]
        properties:
          action: {type: string, const: swipe}
          fromX: {type: number, minimum: 0, maximum: 1}
          fromY: {type: number, minimum: 0, maximum: 1}
          toX: {type: number, minimum: 0, maximum: 1}
          toY: {type: number, minimum: 0, maximum: 1}
          durationMs: {type: integer, minimum: 1, maximum: 10000}
          observation: {type: string, pattern: '^[a-f0-9]{64}$'}
        additionalProperties: false
      - type: object
        required: [action, text]
        properties:
          action: {type: string, const: input}
          text: {type: string}
          replace: {type: boolean}
          observation: {type: string, pattern: '^[a-f0-9]{64}$'}
          id: {type: string, minLength: 1}
          label: {type: string, minLength: 1}
          role: {type: string, minLength: 1}
        additionalProperties: false
        not:
          required: [id, label]
      - type: object
        required: [action, app]
        properties:
          action:
            type: string
            enum: [launchApp, launch]
          app: {type: string, pattern: '^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$'}
          ability: {type: string, pattern: '^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$'}
          module: {type: string, pattern: '^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$'}
          observation: {type: string, pattern: '^[a-f0-9]{64}$'}
        additionalProperties: false
      - type: object
        required: [action]
        properties:
          action: {type: string, const: back}
          observation: {type: string, pattern: '^[a-f0-9]{64}$'}
          id: {type: string, minLength: 1}
          label: {type: string, minLength: 1}
          role: {type: string, minLength: 1}
        additionalProperties: false
        not:
          required: [id, label]
      - type: object
        required: [action]
        properties:
          action: {type: string, const: waitFor}
          state:
            type: string
            enum: [visible, hidden]
          timeoutMs: {type: integer, minimum: 1, maximum: 60000}
          observation: {type: string, pattern: '^[a-f0-9]{64}$'}
          id: {type: string, minLength: 1}
          label: {type: string, minLength: 1}
          role: {type: string, minLength: 1}
          within: {type: string, minLength: 1}
          cardX: {type: number, minimum: 0, maximum: 1}
          cardY: {type: number, minimum: 0, maximum: 1}
        dependentRequired:
          within: [id, role]
          cardX: [within, cardY]
          cardY: [within, cardX]
        additionalProperties: false
        oneOf:
        - required: [id]
        - required: [label]
      - type: object
        required: [action]
        properties:
          action: {type: string, const: goHome}
        additionalProperties: false
    ScriptStep:
      oneOf:
      - type: object
        required: [action]
        properties:
          action: {type: string, const: tap}
          observation: {type: string, pattern: '^[a-f0-9]{64}$'}
          id: {type: string, minLength: 1}
          label: {type: string, minLength: 1}
          role: {type: string, minLength: 1}
          within: {type: string, minLength: 1}
          cardX: {type: number, minimum: 0, maximum: 1}
          cardY: {type: number, minimum: 0, maximum: 1}
          target: {type: string, minLength: 1}
          inApp: {type: string, pattern: '^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$'}
          reading: {$ref: '#/components/schemas/Reading'}
          screen: {$ref: '#/components/schemas/ScreenGuard'}
          platforms:
            type: array
            items: {$ref: '#/components/schemas/Platform'}
            minItems: 1
        dependentRequired:
          within: [id, role]
          cardX: [within, cardY]
          cardY: [within, cardX]
        additionalProperties: false
        oneOf:
        - required: [id]
        - required: [label]
        - required: [target]
      - type: object
        required: [action, x, y]
        properties:
          action: {type: string, const: tap}
          x: {type: number, minimum: 0, maximum: 1}
          y: {type: number, minimum: 0, maximum: 1}
          observation: {type: string, pattern: '^[a-f0-9]{64}$'}
          inApp: {type: string, pattern: '^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$'}
          reading: {$ref: '#/components/schemas/Reading'}
          screen: {$ref: '#/components/schemas/ScreenGuard'}
          platforms:
